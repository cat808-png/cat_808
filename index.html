<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cat_808</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #ffffff; 
            color: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            z-index: 2;
            margin-top: -150px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .input-group {
            display: flex;
            border-bottom: 1px solid #000000;
            padding: 5px 0;
        }
        input { 
            background: transparent; 
            border: none; 
            color: #000000; 
            font-size: 16px; 
            width: 100%; 
            outline: none;
            font-family: inherit;
            text-align: center;
        }
        .error-msg { 
            color: #ff3333; 
            font-size: 12px;
            margin-top: 15px; 
            height: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        /* Кот, прижатый к нижнему краю экрана */
        .cat-bottom {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: auto;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>cat_808</h1>
        <p>Ход 3/1000. Введите токен ядра.<br><i>Подсказка скрыта в комментариях кода страницы.</i></p>
        
        <div class="input-group">
            <input type="text" id="token-input" autofocus placeholder="..." onkeydown="handleInput(event)">
        </div>
        <div id="error" class="error-msg">Неверный токен. Доступ заблокирован.</div>
    </div>

    <!-- Векторный черный кот строго по центру внизу экрана -->
    <svg class="cat-bottom" viewBox="0 0 100 100" xmlns="http://w3.org">
        <path d="M20,100 C20,70 35,50 50,50 C65,50 80,70 80,100 Z" fill="#000000"/>
        <polygon points="25,56 20,35 38,48" fill="#000000"/>
        <polygon points="75,56 80,35 62,48" fill="#000000"/>
        <circle cx="40" cy="65" r="3" fill="#ffffff"/>
        <circle cx="60" cy="65" r="3" fill="#ffffff"/>
        <path d="M48,73 Q50,75 52,73" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    </svg>

    <script>
        // Привет, искатель. Токен для прохода дальше зашит прямо здесь. 
        // Переведи этот двоичный код в текст: 
        // 01101110 01100101 01101111 01101110 01011111 00111000 00110000 00111000
        
        const correctToken = "neon_808"; 

        function handleInput(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('token-input');
                const error = document.getElementById('error');
                
                if (input.value.trim().toLowerCase() === correctToken) {
                    error.style.opacity = 0;
                    input.disabled = true;
                    // Перенаправление на ваш Telegram-канал
                    window.location.href = "https://t.me";
                } else {
                    error.style.opacity = 1;
                    input.value = '';
                }
            }
        }
    </script>
</body>
</html>
